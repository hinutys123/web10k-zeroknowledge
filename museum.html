<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria | Museo 3D Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        
        /* Canvas 3D */
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Panel de Control Flotante */
        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls-panel h3 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }
        .control-group {
            margin-bottom: 1rem;
        }
        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.4rem;
        }
        select {
            width: 100%;
            padding: 0.6rem;
            background: #222;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
        }
        
        /* Botón de Regreso */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 0.6rem 1.2rem;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Instrucciones de navegación */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #aaa;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592; Volver al Inicio</a>

    <div class="controls-panel">
        <h3>Curaduría de Entorno</h3>
        <div class="control-group">
            <label for="bgSelect">Fondo / Ambiente</label>
            <select id="bgSelect">
                <option value="minimal">Minimalista Oscuro</option>
                <option value="warm">Galería Cálida / Madera</option>
                <option value="cyber">Neón Futurista</option>
            </select>
        </div>
        <div class="control-group">
            <label for="lightSelect">Tipo de Iluminación</label>
            <select id="lightSelect">
                <option value="spot">Focos Cenitales (Dramatic)</option>
                <option value="soft">Luz Difusa Suave</option>
                <option value="neon">Brillo RGB Dinámico</option>
            </select>
        </div>
    </div>

    <div class="instructions">Usa el cursor para explorar el entorno 3D de la galería</div>

    <div id="webgl-container"></div>

    <!-- Three.js vía CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Inicialización de la Escena 3D con Three.js
        const container = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Iluminación base
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 5, 5);
        scene.add(mainLight);

        const secondaryLight = new THREE.PointLight(0xffffff, 1, 10);
        secondaryLight.position.set(-5, 0, 2);
        scene.add(secondaryLight);

        // Crear una Galería Virtual Simple (Paredes y Marcos Flotantes)
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.9 });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 10, 0.2), wallMaterial);
        backWall.position.z = -3;
        scene.add(backWall);

        // Marcos Flotantes (Simulando cuadros de arte)
        const frameGeometry = new THREE.BoxGeometry(2.2, 3.2, 0.1);
        const canvasGeometry = new THREE.PlaneGeometry(2, 3);

        // Material placeholder para los cuadros (puedes cambiar la textura por una imagen tuya)
        const placeholderMaterial = new THREE.MeshBasicMaterial({ color: 0x333333 });

        // Cuadro Central
        const frameCenter = new THREE.Mesh(frameGeometry, new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.2 }));
        const artCenter = new THREE.Mesh(canvasGeometry, placeholderMaterial);
        artCenter.position.z = 0.06;
        frameCenter.add(artCenter);
        frameCenter.position.set(0, 0, -2.8);
        scene.add(frameCenter);

        // Cuadro Izquierdo
        const frameLeft = frameCenter.clone();
        frameLeft.position.set(-4, 0, -2.8);
        scene.add(frameLeft);

        // Cuadro Derecho
        const frameRight = frameCenter.clone();
        frameRight.position.set(4, 0, -2.8);
        scene.add(frameRight);

        // Interacción de Movimiento de Cámara con Mouse
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseX = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Cambio de Fondos (3 Opciones)
        const bgSelect = document.getElementById('bgSelect');
        bgSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'minimal') {
                scene.background = new THREE.Color(0x0b0b0b);
                wallMaterial.color.setHex(0x141414);
            } else if (val === 'warm') {
                scene.background = new THREE.Color(0x1f1a17);
                wallMaterial.color.setHex(0x2c221e);
            } else if (val === 'cyber') {
                scene.background = new THREE.Color(0x05051a);
                wallMaterial.color.setHex(0x0a0a2e);
            }
        });

        // Cambio de Iluminación (3 Opciones)
        const lightSelect = document.getElementById('lightSelect');
        lightSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'spot') {
                mainLight.color.setHex(0xffffff);
                mainLight.intensity = 1.5;
                ambientLight.intensity = 0.2;
                secondaryLight.color.setHex(0xffaa00);
            } else if (val === 'soft') {
                mainLight.color.setHex(0xe6f2ff);
                mainLight.intensity = 0.8;
                ambientLight.intensity = 0.7;
                secondaryLight.color.setHex(0xe6f2ff);
            } else if (val === 'neon') {
                mainLight.color.setHex(0xff00ff);
                mainLight.intensity = 2.0;
                ambientLight.intensity = 0.4;
                secondaryLight.color.setHex(0x00ffff);
            }
        });

        // Bucle de Animación
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            // Efecto sutil de paralaje en la cámara según el mouse
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
