<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetheria | Museo 3D Interactivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }
        
        /* Canvas 3D */
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Panel de Control Flotante */
        .controls-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls-panel h3 {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }
        .control-group {
            margin-bottom: 1rem;
        }
        .control-group label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 0.4rem;
        }
        select {
            width: 100%;
            padding: 0.6rem;
            background: #222;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
        }
        
        /* Botón de Regreso */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            padding: 0.6rem 1.2rem;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Instrucciones de navegación */
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #aaa;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592; Volver al Inicio</a>

    <div class="controls-panel">
        <h3>Curaduría de Entorno</h3>
        <div class="control-group">
            <label for="bgSelect">Fondo / Ambiente</label>
            <select id="bgSelect">
                <option value="bg1">Ambiente 1 (Clásico/Oscuro)</option>
                <option value="bg2">Ambiente 2 (Textura Textil)</option>
                <option value="bg3">Ambiente 3 (Elegante/Gris)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="lightSelect">Iluminación Cenital</label>
            <select id="lightSelect">
                <option value="strong">Luz Fuerte (Intensa)</option>
                <option value="medium">Luz Media (Estándar)</option>
                <option value="soft">Luz Baja / Tenue</option>
            </select>
        </div>
    </div>

    <div class="instructions">Usa el cursor para explorar la galería de 10 obras</div>

    <div id="webgl-container"></div>

    <!-- Three.js vía CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('webgl-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Carga de Texturas de Fondo Proporcionadas
        const textureLoader = new THREE.TextureLoader();
        const bgTexture1 = textureLoader.load('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5cncth3JTJ8vvNHYehwR1SmqzlMxX0gaWB5pEqsbk9w&s=10');
        const bgTexture2 = textureLoader.load('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTweMnnnUfa-R8CKraKwQpnf4K8AWlKM_Sxc0hNYPuBSA&s=10');
        const bgTexture3 = textureLoader.load('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfaLsKD7k_I3f68uxiCkD5uzEBmXroiXr67NHJuiySwA&s=10');

        // Pared de la galería principal
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            map: bgTexture1, 
            roughness: 0.8 
        });
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(32, 12, 0.2), wallMaterial);
        backWall.position.z = -3.2;
        scene.add(backWall);

        // Sistema de Iluminación Cenital Cónica (Spotlights simulando focos de techo)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        // Creamos focos cenitales que apuntan hacia abajo/frente
        const spotlights = [];
        for(let i = 0; i < 3; i++) {
            const spot = new THREE.SpotLight(0xfff3e0, 2.5, 15, Math.PI / 4, 0.5, 1);
            spot.position.set((i - 1) * 5, 5, 1);
            spot.target.position.set((i - 1) * 5, 0, -2.8);
            scene.add(spot);
            scene.add(spot.target);
            spotlights.push(spot);
        }

        // Función para generar texturas de las 10 obras con emojis artísticos variados
        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '180px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(emoji, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        // Exactamente 10 obras de arte
        const emojis = ['🎨', '🚀', '💎', '🏛️', '⚡', '🌀', '🔮', '🌿', '🔥', '🌊'];
        const artworksGroup = new THREE.Group();

        const frameGeometry = new THREE.BoxGeometry(1.8, 2.4, 0.08);
        const canvasGeometry = new THREE.PlaneGeometry(1.6, 2.2);
        const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 });

        // Distribuir los 10 cuadros a lo largo del muro
        emojis.forEach((emoji, index) => {
            const texture = createEmojiTexture(emoji);
            const artMaterial = new THREE.MeshBasicMaterial({ map: texture });

            const frame = new THREE.Mesh(frameGeometry, frameMaterial);
            const art = new THREE.Mesh(canvasGeometry, artMaterial);
            art.position.z = 0.05;
            frame.add(art);

            // Posicionamiento en fila distribuida en el eje X
            const xPos = (index - 4.5) * 2.8;
            frame.position.set(xPos, 0, -3.0);
            
            artworksGroup.add(frame);
        });
        scene.add(artworksGroup);

        // Control de Mouse / Paralaje suave
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Selector de Fondos con las texturas proporcionadas
        const bgSelect = document.getElementById('bgSelect');
        bgSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'bg1') {
                wallMaterial.map = bgTexture1;
            } else if (val === 'bg2') {
                wallMaterial.map = bgTexture2;
            } else if (val === 'bg3') {
                wallMaterial.map = bgTexture3;
            }
            wallMaterial.needsUpdate = true;
        });

        // Selector de Iluminación Cenital (Intensidades cónicas solicitadas)
        const lightSelect = document.getElementById('lightSelect');
        lightSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            let intensity = 2.5;
            if (val === 'strong') {
                intensity = 4.0;
                ambientLight.intensity = 0.4;
            } else if (val === 'medium') {
                intensity = 2.0;
                ambientLight.intensity = 0.3;
            } else if (val === 'soft') {
                intensity = 0.8;
                ambientLight.intensity = 0.15;
            }
            spotlights.forEach(spot => spot.intensity = intensity);
        });

        // Animación y renderizado
        function animate() {
            requestAnimationFrame(animate);

            targetX = mouseX * 2.5;
            targetY = mouseY * 0.8;
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;
            camera.lookAt(camera.position.x, camera.position.y, -3);

            renderer.render(scene, camera);
        }
        animate();

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
